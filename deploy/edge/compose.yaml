services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is not set}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        # the live backends trust the client address header from this address only
        ipv4_address: 172.30.0.2

networks:
  edge:
    external: true
