apiVersion: 1

providers:
  - name: live-production
    folder: Semantifyr Live production
    folderUid: live-production
    type: file
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/production
  - name: live-staging
    folder: Semantifyr Live staging
    folderUid: live-staging
    type: file
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/staging
  - name: host
    type: file
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/host
