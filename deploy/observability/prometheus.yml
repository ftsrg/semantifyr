global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: semantifyr-live
    static_configs:
      - targets: ["semantifyr-live:8081"]
        labels:
          instance: semantifyr-live
      - targets: ["semantifyr-live-staging:8081"]
        labels:
          instance: semantifyr-live-staging
