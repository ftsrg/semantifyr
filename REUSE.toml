version = 1

[[annotations]]
path = [
    "subprojects/frontends/*/models/**",
    "subprojects/website/src/docs/**",
    "subprojects/website/static/**",
    "subprojects/backends/theta/*/src/main/java/**/*.java",
    "subprojects/backends/*/*-backend/src/test/resources/captured/**",
    "subprojects/semantifyr-vscode-server/**",
    "**/package.json",
    "**/tsconfig*.json",
    "**/.gitignore",
    "subprojects/semantifyr-editor-common/src/terms/terms.json",
    "subprojects/semantifyr-editor-common/src/examples/examples.json",
    "oxsts-test-models/tutorial/**",
    ".nvmrc",
]
SPDX-FileCopyrightText = "2023-2026 The Semantifyr Authors"
SPDX-License-Identifier = "EPL-2.0"

[[annotations]]
path = "subprojects/semantifyr-live/frontend/src/__ui__/mock/fixtures/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The Semantifyr Authors"
SPDX-License-Identifier = "EPL-2.0"

[[annotations]]
path = "subprojects/semantifyr-editor-common/src/look/fonts/open-sans-*.woff2"
SPDX-FileCopyrightText = "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "subprojects/semantifyr-editor-common/src/look/fonts/jetbrains-mono-*.woff2"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Copied from https://github.com/ftsrg/gamma at commit 7f8695a4d with only the package and import lines rewritten to qualified names; each file's path below models/corpus is its path in that repository.
[[annotations]]
path = "subprojects/frontends/gamma/models/corpus/**/*.gcd"
precedence = "override"
SPDX-FileCopyrightText = "The contributors to the Gamma project"
SPDX-License-Identifier = "EPL-1.0"

# from the Crossroads of the Gamma tutorial, https://github.com/ftsrg/gamma/tree/master/tutorial/hu.bme.mit.gamma.tutorial.finish/model
[[annotations]]
path = "subprojects/frontends/gamma/models/examples/Crossroads.gamma"
precedence = "override"
SPDX-FileCopyrightText = "The contributors to the Gamma project"
SPDX-License-Identifier = "EPL-1.0"

# rewritten by the Semantifyr authors: the Spacecraft of the Gamma repository's tests in Gamma's syntax, and the Crossroads of the Gamma tutorial and that Spacecraft in SysML v2; the Spacecraft follows the subject of OpenMBEE's Simple Space Mission
[[annotations]]
path = [
    "subprojects/frontends/gamma/models/examples/Spacecraft.gamma",
    "subprojects/frontends/sysml/models/examples/crossroads.sysml",
    "subprojects/frontends/sysml/models/examples/crossroads.further-cases",
    "subprojects/frontends/sysml/models/examples/compressedspacecraft.sysml",
    "subprojects/frontends/sysml/models/examples/compressedspacecraft.further-cases",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "The contributors to the Gamma project",
    "2023-2026 The Semantifyr Authors",
]
SPDX-License-Identifier = "EPL-1.0"

# origins of corpus models that are not served and whose rights holders are not recorded yet: orion_protocol.sysml is Prolan's Orion protocol, from the 2018-1.3.1-VKE project; spacecraft.sysml follows OpenMBEE's Simple Space Mission; autonomous_driving.sysml follows the paper "Automatic Formal Verification of SysML State Machine Diagrams for Vehicular Control Systems" of Clemson University
[[annotations]]
path = [
    "subprojects/frontends/sysml/models/examples/orion_protocol.sysml",
    "subprojects/frontends/sysml/models/examples/spacecraft.sysml",
    "subprojects/frontends/sysml/models/examples/autonomous_driving.sysml",
]
SPDX-FileCopyrightText = "2023-2026 The Semantifyr Authors"
SPDX-License-Identifier = "EPL-2.0"
