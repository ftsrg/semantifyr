appender.console.type=Console
appender.console.name=STDERR
appender.console.target=SYSTEM_ERR
appender.console.layout.type=PatternLayout
appender.console.layout.selector.type=LevelPatternSelector
appender.console.layout.selector.alwaysWriteExceptions=false
appender.console.layout.selector.defaultPattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n%throwable
appender.console.layout.selector.warn.type=PatternMatch
appender.console.layout.selector.warn.key=WARN
appender.console.layout.selector.warn.pattern=warning: %msg%notEmpty{: %throwable{short.message}}%n
appender.console.layout.selector.error.type=PatternMatch
appender.console.layout.selector.error.key=ERROR
appender.console.layout.selector.error.pattern=error: %msg%notEmpty{: %throwable{short.message}}%n
appender.console.layout.selector.fatal.type=PatternMatch
appender.console.layout.selector.fatal.key=FATAL
appender.console.layout.selector.fatal.pattern=error: %msg%notEmpty{: %throwable{short.message}}%n

rootLogger.level=WARN
rootLogger.appenderRef.stderr.ref=STDERR
