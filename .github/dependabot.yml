version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
  - package-ecosystem: "docker"
    directories:
      - "/subprojects/semantifyr-live/backend"
      - "/subprojects/semantifyr-vscode-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy/edge"
      - "/deploy/observability"
    schedule:
      interval: "weekly"
