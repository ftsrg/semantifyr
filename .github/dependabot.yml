version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
  - package-ecosystem: "docker"
    directories:
      - "/subprojects/semantifyr-live/backend"
      - "/subprojects/semantifyr-vscode-server"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy/edge"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
