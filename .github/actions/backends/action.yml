name: install-backends
description: Installs Spin and nuXmv.
runs:
  using: composite
  steps:
    - name: Install Spin
      shell: sh
      run: sudo apt-get update && sudo apt-get install -y spin
    - name: Install nuXmv
      shell: sh
      run: |
        mkdir -p "$HOME/tools"
        curl -fsSL --proto '=https' -o "$HOME/tools/nuXmv.tar.xz" "https://nuxmv.fbk.eu/theme/download.php?file=nuXmv-2.1.0-linux64.tar.xz"
        echo "c7dfec43749bcb230c857efe81099b95d868b94efd9f81bccebe542a306a7c83  $HOME/tools/nuXmv.tar.xz" | sha256sum -c
        tar -xJf "$HOME/tools/nuXmv.tar.xz" -C "$HOME/tools"
        echo "$HOME/tools/nuXmv-2.1.0-linux64/bin" >> "$GITHUB_PATH"
    - name: Check the backends and Docker
      shell: sh
      run: .github/scripts/check-backends.sh spin nuxmv docker
