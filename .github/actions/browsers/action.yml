name: install-browsers
description: Installs the browsers
inputs:
  browsers:
    description: The browsers, separated by spaces.
    required: true
runs:
  using: composite
  steps:
    - name: Cache
      id: cache-key
      shell: sh
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "key=browsers-$ImageOS-$version-$(echo "$BROWSERS" | tr ' ' '-')" >> "$GITHUB_OUTPUT"
        mkdir -p "$HOME/.cache/apt-archives/partial"
        printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/90-cached-archives > /dev/null
    - name: Restore the browser cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/apt-archives
        key: ${{ steps.cache-key.outputs.key }}
    - name: Install the browsers
      shell: sh
      env:
        BROWSERS: ${{ inputs.browsers }}
        VERSION: ${{ steps.cache-key.outputs.version }}
      run: |
        npx --yes "playwright@$VERSION" install --with-deps $BROWSERS
        sudo chmod -R a+rX "$HOME/.cache/apt-archives"
