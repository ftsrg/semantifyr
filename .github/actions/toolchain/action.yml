name: setup-toolchain
description: Sets up Java, Gradle and Node.
inputs:
  gradle-encryption-key:
    description: The key that encrypts Gradle's configuration cache in the Actions cache.
    required: false
runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
