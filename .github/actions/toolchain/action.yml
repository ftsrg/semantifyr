name: setup-toolchain
description: Sets up Java, Gradle and Node.
inputs:
  gradle:
    description: Whether to set up Gradle.
    default: 'true'
  gradle-encryption-key:
    description: The key that encrypts Gradle's configuration cache in the Actions cache.
    required: false
runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: 25
        distribution: temurin
    - name: Setup Gradle
      if: ${{ inputs.gradle == 'true' }}
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
