name: Release
on:
  workflow_dispatch:
permissions: {}
jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version
        id: version
        run: .github/scripts/read-version.sh "$GITHUB_SHA"
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: if gh release view "v$VERSION" > /dev/null 2>&1; then echo "v$VERSION is already released; bump gradle.properties" >&2; exit 1; fi
      - name: Download the distributions of this commit's delivery run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow cd.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          # one artifact per call, since gh puts each artifact of a multi-artifact download in a directory of its own
          for artifact in semantifyr-cli sysml-cli gamma-cli semantifyr-vscode; do
            gh run download "$run" --name "$artifact" --dir distributions
          done
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the snapshot image as the release
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SNAPSHOT: ${{ steps.version.outputs.snapshot }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE:$SNAPSHOT"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - name: Publish the extension to both marketplaces
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          : "${VSCE_PAT:?}" "${OVSX_PAT:?}"
          vsce=$(jq -r '.packages["node_modules/@vscode/vsce"].version' package-lock.json)
          npx --yes "@vscode/vsce@$vsce" publish --packagePath "distributions/semantifyr-$VERSION.vsix" --skip-duplicate
          npx --yes ovsx@1.3.0 publish "distributions/semantifyr-$VERSION.vsix" --skip-duplicate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release create "v$VERSION" distributions/* --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Live image: \`$IMAGE@$DIGEST\`" --generate-notes
