name: Release
on:
  workflow_dispatch:
permissions: {}
jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: .github/scripts/read-version.sh "$GITHUB_SHA"
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/refuse-existing-release.sh "$VERSION"
      - name: Download the distributions of this commit's delivery run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/download-distributions.sh "$GITHUB_SHA" distributions semantifyr-cli sysml-cli gamma-cli semantifyr-vscode
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the snapshot image as the release
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SNAPSHOT: ${{ steps.version.outputs.snapshot }}
        run: .github/scripts/tag-release-image.sh "$IMAGE" "$VERSION" "$SNAPSHOT"
      - name: Publish the extension to the marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/publish-extension.sh "distributions/semantifyr-$VERSION.vsix"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release create "v$VERSION" distributions/* --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "Live image: \`$IMAGE@$DIGEST\`" --generate-notes
