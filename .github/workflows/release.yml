name: Release
on:
  workflow_dispatch:
permissions: {}
jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "snapshot=$version-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; bump gradle.properties" >&2
            exit 1
          fi
      - name: Download the distributions of this commit's delivery run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow cd.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "$GITHUB_SHA has no successful Continuous Delivery run" >&2
            exit 1
          fi
          gh run download "$run" --name distributions --dir distributions
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the snapshot image as the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SNAPSHOT: ${{ steps.version.outputs.snapshot }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$SNAPSHOT"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" distributions/* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
