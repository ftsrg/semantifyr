name: Continuous Delivery
on:
  push:
    branches: [ "main" ]
concurrency:
  group: cd
  cancel-in-progress: false
permissions: {}
jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      publish: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  website:
    name: Deploy Website
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  staging:
    name: Deploy Staging
    needs: ci
    uses: ./.github/workflows/deploy-live.yml
    permissions:
      contents: read
    with:
      instance: semantifyr-live-staging
      tag: ${{ needs.ci.outputs.tag }}
      url: https://live-staging.semantifyr.org
    # without inherit the called job sees its environment secrets as empty (actions/runner#4453)
    secrets: inherit
