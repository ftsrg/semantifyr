name: Deploy Edge
on:
  push:
    branches: [ "main" ]
    paths: [ "deploy/edge/**" ]
  workflow_dispatch:
permissions: {}
jobs:
  deploy:
    name: Deploy Edge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-edge
      cancel-in-progress: false
    environment: live-fured
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }}
          user: ${{ vars.DEPLOY_USER }}
      - name: Deploy
        run: tar -C deploy/edge --exclude env.example -cz . | ssh fured edge

  smoke-test:
    name: Smoke test ${{ matrix.url }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        url: [ "https://live.semantifyr.org", "https://live-staging.semantifyr.org" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        timeout-minutes: 10
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ matrix.url }}
