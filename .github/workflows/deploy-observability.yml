name: Deploy Observability
on:
  push:
    branches: [ "main" ]
    paths: [ "deploy/observability/**", ".github/scripts/deploy-compose-project.sh" ]
  workflow_dispatch:
permissions: {}
jobs:
  deploy:
    name: Deploy Observability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-observability
      cancel-in-progress: false
    environment: live-fured
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make the dashboards of each environment
        run: |
          release="$RUNNER_TEMP/release"
          mkdir "$release"
          cp deploy/observability/* "$release"
          cp .github/scripts/deploy-compose-project.sh "$release/deploy.sh"
          rm "$release"/env.example "$release"/live-*
          mkdir -p "$release/dashboards/production" "$release/dashboards/staging"
          for source in deploy/observability/live-*.json; do
            name=${source##*/live-}
            sed -e 's/@instance@/semantifyr-live/g' -e 's/@environment@/production/g' "$source" > "$release/dashboards/production/$name"
            sed -e 's/@instance@/semantifyr-live-staging/g' -e 's/@environment@/staging/g' "$source" > "$release/dashboards/staging/$name"
          done
      - name: Check the dashboards
        run: jq empty "$RUNNER_TEMP"/release/*.json "$RUNNER_TEMP"/release/dashboards/*/*.json
      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }}
          user: ${{ vars.DEPLOY_USER }}
      - name: Deploy
        run: tar -C "$RUNNER_TEMP/release" -cz . | ssh fured observability
