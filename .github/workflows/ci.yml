name: Continuous Integration
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      GRADLE_ENCRYPTION_KEY:
        required: false
    outputs:
      tag:
        value: ${{ jobs.live-image.outputs.tag }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
env:
  CI: true
  THETA_JAVA_OPTS: -Xss512M -Xms256M -Xmx1500M
jobs:
  build:
    name: Build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Gradle build
        shell: bash
        run: ./gradlew build -Ptests.requiredBackends=theta
      - name: Merge coverage reports
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: ./gradlew mergedJacocoReport
      - name: Upload coverage reports
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-reports
          path: build/reports/jacoco/mergedJacocoReport/html/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish to SonarCloud
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            ./gradlew sonar
          fi
      - name: Upload GitHub Pages artifact
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: subprojects/website/build/docusaurus
          retention-days: 90
      - name: Stage the distributions and the live image context
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        # a tarball, because upload-artifact drops the execute bits the launchers need
        run: |
          ./gradlew :semantifyr-vscode:bundleExtension :semantifyr-live-backend:prepareDockerBuild
          tar -czf live-image-context.tar.gz -C subprojects/semantifyr-live/backend \
            Dockerfile build/install build/staging build/theta-xsts-cli
      - name: Upload the distributions
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: subprojects/semantifyr-vscode/build/semantifyr-*.vsix
          if-no-files-found: error
          retention-days: 90
      - name: Upload the live image context
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: live-image-context
          path: live-image-context.tar.gz
          compression-level: 0
          retention-days: 1

  reuse-check:
    name: REUSE Compliance Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  live-image:
    name: Live Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IMAGE: ghcr.io/ftsrg/semantifyr-live
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download the live image context
        uses: actions/download-artifact@v8
        with:
          name: live-image-context
      - name: Unpack the live image context
        run: |
          mkdir context
          tar -xzf live-image-context.tar.gz -C context
      - name: Compute the tag
        id: tag
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "tag=$version-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          load: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:snapshot
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run -d --name live -p 8080:8080 --cap-drop ALL --security-opt no-new-privileges:true \
            -e SEMANTIFYR_LIVE_ADMIN_PASSWORD=smoke "$IMAGE:$TAG"
          for _ in $(seq 60); do
            curl -fsS http://localhost:8080/api/health > /dev/null && break
            sleep 3
          done
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ > /dev/null
          docker exec live theta-xsts-cli --version
      - name: Show the container log
        if: ${{ failure() }}
        run: docker logs live
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:snapshot"
