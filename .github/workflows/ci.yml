name: Continuous Integration
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      GRADLE_ENCRYPTION_KEY:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      tag:
        value: ${{ jobs.live-image.outputs.tag }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
env:
  CI: true
  THETA_JAVA_OPTS: -Xss512M -Xms256M -Xmx1500M
jobs:
  build:
    name: Build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # only the ubuntu leg uploads the website
      WEBSITE_API_DOCS: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Spin
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y spin
      - name: Check the engines
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: .github/scripts/check-engines.sh spin docker
      - name: Gradle build
        shell: bash
        run: ./gradlew build --continue -Pwebsite.apiDocs=$WEBSITE_API_DOCS
      - name: Install the browsers for the live screen and UI tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the live screen tests on Chromium
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        env:
          TEST_BROWSER: chromium
        run: npm run screens -w @ftsrg/semantifyr-live-frontend
      - name: Run the live UI tests on Chromium
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        env:
          TEST_BROWSER: chromium
        run: npm run ui -w @ftsrg/semantifyr-live-frontend
      - name: Run the live screen tests on Firefox
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        env:
          TEST_BROWSER: firefox
        run: npm run screens -w @ftsrg/semantifyr-live-frontend
      - name: Run the live UI tests on Firefox
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        env:
          TEST_BROWSER: firefox
        run: npm run ui -w @ftsrg/semantifyr-live-frontend
      - name: Run the live screen tests on WebKit
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        env:
          TEST_BROWSER: webkit
        run: npm run screens -w @ftsrg/semantifyr-live-frontend
      - name: Run the live UI tests on WebKit
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        env:
          TEST_BROWSER: webkit
        run: npm run ui -w @ftsrg/semantifyr-live-frontend
      - name: Upload the live screens
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-screens
          path: subprojects/semantifyr-live/frontend/build/screens/
          if-no-files-found: warn
      - name: Upload the evidence of failed live UI tests
        if: ${{ matrix.os == 'ubuntu-latest' && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-ui-evidence
          path: subprojects/semantifyr-live/frontend/build/evidence/
          if-no-files-found: ignore
      - name: Read the VS Code version of the integration test
        id: vscode
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: echo "version=$(jq -r '.engines.vscode | ltrimstr("^")' subprojects/semantifyr-vscode/package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache the VS Code download
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/cache@v6
        with:
          path: subprojects/semantifyr-vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ steps.vscode.outputs.version }}
      - name: Run integration tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: ./gradlew integrationTest --continue
      - name: Merge coverage reports
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: ./gradlew mergedJacocoReport
      - name: Upload coverage reports
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-reports
          path: build/reports/jacoco/mergedJacocoReport/html/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish to SonarCloud
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: .github/scripts/sonar.sh
      - name: Upload GitHub Pages artifact
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: subprojects/website/build/docusaurus
          retention-days: 90
      - name: Pack the live image context
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: ./gradlew :semantifyr-live-backend:liveImageContext
      - name: Upload semantifyr-cli
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: semantifyr-cli
          path: subprojects/semantifyr-cli/build/distributions/semantifyr-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload sysml-cli
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: sysml-cli
          path: subprojects/frontends/sysml/sysml-cli/build/distributions/semantifyr-sysml-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload gamma-cli
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: gamma-cli
          path: subprojects/frontends/gamma/gamma-cli/build/distributions/semantifyr-gamma-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload semantifyr-vscode
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: semantifyr-vscode
          path: subprojects/semantifyr-vscode/build/semantifyr-*.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload the live image context
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        # a tarball, because upload-artifact drops the execute bits the image needs
        with:
          name: live-image-context
          path: subprojects/semantifyr-live/backend/build/distributions/live-image-context.tar.gz
          compression-level: 0
          retention-days: 1

  reuse-check:
    name: REUSE Compliance Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          # reuse skips every directory under one named subprojects, taking it for Meson's
          args: --include-meson-subprojects lint

  live-image:
    name: Live Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download the live image context
        uses: actions/download-artifact@v8
        with:
          name: live-image-context
      - name: Unpack the live image context
        run: mkdir context && tar -xzf live-image-context.tar.gz -C context
      - name: Compute the tag
        id: tag
        run: echo "tag=$(sed -n 's/^version=//p' gradle.properties)-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          load: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:snapshot
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/smoke-test-live-image.sh live "$IMAGE:$TAG"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify on the image
        timeout-minutes: 5
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
        run: npm run smoke -w @ftsrg/semantifyr-live-frontend
      - name: Install the browsers for the live flows
        id: browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the live flows on the image on Chromium
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: chromium
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on Firefox
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: firefox
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: webkit
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Upload the evidence of failed live flows
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-flows-evidence
          path: subprojects/semantifyr-live/frontend/build/evidence/
          if-no-files-found: ignore
      - name: Show the container log
        if: ${{ failure() }}
        run: docker logs live
      - name: Log in to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker push "$IMAGE:$TAG" && docker push "$IMAGE:snapshot"
