name: Continuous Integration
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      GRADLE_ENCRYPTION_KEY:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      tag:
        value: ${{ jobs.live-image.outputs.tag }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
env:
  CI: true
  THETA_JAVA_OPTS: -Xss512M -Xms256M -Xmx1500M
jobs:
  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # the published website names its commit; every other build of it describes the development branch and stays cacheable
      SEMANTIFYR_SITE_COMMIT: ${{ inputs.publish && github.sha || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Compile and pack
        run: ./gradlew assemble -Pwebsite.apiDocs=true
      - name: Stop Gradle
        run: ./gradlew --stop
      # the test jobs take what this job compiled from its build cache, as a pull request's run writes no cache entry
      - name: Pack the build cache
        run: tar -cf "$RUNNER_TEMP/build-cache.tar" -C ~/.gradle/caches/build-cache-1 .
      - name: Upload the build cache
        uses: actions/upload-artifact@v7
        with:
          name: build-cache
          path: ${{ runner.temp }}/build-cache.tar
          compression-level: 0
          retention-days: 1
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: subprojects/website/build/docusaurus
          retention-days: 90
      - name: Upload semantifyr-cli
        uses: actions/upload-artifact@v7
        with:
          name: semantifyr-cli
          path: subprojects/semantifyr-cli/build/distributions/semantifyr-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload sysml-cli
        uses: actions/upload-artifact@v7
        with:
          name: sysml-cli
          path: subprojects/frontends/sysml/sysml-cli/build/distributions/semantifyr-sysml-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload gamma-cli
        uses: actions/upload-artifact@v7
        with:
          name: gamma-cli
          path: subprojects/frontends/gamma/gamma-cli/build/distributions/semantifyr-gamma-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload semantifyr-vscode
        uses: actions/upload-artifact@v7
        with:
          name: semantifyr-vscode
          path: subprojects/semantifyr-vscode/build/semantifyr-*.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload the live image context
        uses: actions/upload-artifact@v7
        # a tarball, because upload-artifact drops the execute bits the image needs
        with:
          name: live-image-context
          path: subprojects/semantifyr-live/backend/build/distributions/live-image-context.tar.gz
          compression-level: 0
          retention-days: 1

  units:
    name: Units and adapters (${{ matrix.os }})
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the backends
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/backends
      - name: Download the build cache
        if: ${{ runner.os == 'Linux' }}
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: ${{ runner.temp }}
      - name: Unpack the build cache
        if: ${{ runner.os == 'Linux' }}
        run: mkdir -p ~/.gradle/caches/build-cache-1 && tar -xf "$RUNNER_TEMP/build-cache.tar" -C ~/.gradle/caches/build-cache-1
      - name: Run the unit and adapter suites
        shell: bash
        run: ./gradlew build --continue
      - name: Publish to SonarCloud and wait for its quality gate
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: .github/scripts/sonar.sh

  semantics:
    name: Semantics
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the backends
        uses: ./.github/actions/backends
      - name: Download the build cache
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: ${{ runner.temp }}
      - name: Unpack the build cache
        run: mkdir -p ~/.gradle/caches/build-cache-1 && tar -xf "$RUNNER_TEMP/build-cache.tar" -C ~/.gradle/caches/build-cache-1
      - name: Run the semantic suite
        run: ./gradlew semanticTest --continue

  integration:
    name: Integration
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the backends
        uses: ./.github/actions/backends
      - name: Download the build cache
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: ${{ runner.temp }}
      - name: Unpack the build cache
        run: mkdir -p ~/.gradle/caches/build-cache-1 && tar -xf "$RUNNER_TEMP/build-cache.tar" -C ~/.gradle/caches/build-cache-1
      - name: Run the integration suite
        run: ./gradlew integrationTest --continue

  end-to-end:
    name: End to end
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the backends
        uses: ./.github/actions/backends
      - name: Read the VS Code version of the end-to-end test
        id: vscode
        run: echo "version=$(jq -r '.engines.vscode | ltrimstr("^")' subprojects/semantifyr-vscode/package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache the VS Code download
        uses: actions/cache@v6
        with:
          path: subprojects/semantifyr-vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ steps.vscode.outputs.version }}
      - name: Download the build cache
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: ${{ runner.temp }}
      - name: Unpack the build cache
        run: mkdir -p ~/.gradle/caches/build-cache-1 && tar -xf "$RUNNER_TEMP/build-cache.tar" -C ~/.gradle/caches/build-cache-1
      - name: Run the end-to-end suite
        run: ./gradlew endToEndTest --continue

  ui:
    name: UI (${{ matrix.browser }})
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the browser
        run: npx --yes "playwright@$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" install --with-deps "$BROWSER"
      - name: Download the build cache
        uses: actions/download-artifact@v8
        with:
          name: build-cache
          path: ${{ runner.temp }}
      - name: Unpack the build cache
        run: mkdir -p ~/.gradle/caches/build-cache-1 && tar -xf "$RUNNER_TEMP/build-cache.tar" -C ~/.gradle/caches/build-cache-1
      - name: Run the UI suite
        # the walk takes the website the Build job made, API docs included
        run: ./gradlew uiTest --continue -PtestBrowser="$BROWSER" -Pwebsite.apiDocs=true
      - name: Upload the live screens
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-screens-${{ matrix.browser }}
          path: subprojects/semantifyr-live/frontend/build/screens/
          if-no-files-found: warn
      - name: Upload the evidence of failed UI tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence-${{ matrix.browser }}
          path: |
            subprojects/semantifyr-live/frontend/build/evidence/
            subprojects/website/build/evidence/
          if-no-files-found: ignore

  reuse-check:
    name: REUSE Compliance Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          # reuse skips every directory under one named subprojects, taking it for Meson's
          args: --include-meson-subprojects lint

  live-image:
    name: Live Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download the live image context
        uses: actions/download-artifact@v8
        with:
          name: live-image-context
      - name: Unpack the live image context
        run: mkdir context && tar -xzf live-image-context.tar.gz -C context
      - name: Compute the tag
        id: tag
        run: echo "tag=$(sed -n 's/^version=//p' gradle.properties)-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          load: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:snapshot
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/smoke-test-live-image.sh live "$IMAGE:$TAG"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify on the image
        timeout-minutes: 5
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
        run: npm run smoke -w @ftsrg/semantifyr-live-frontend
      - name: Install the browsers for the live flows
        id: browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the live flows on the image on Chromium
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: chromium
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on Firefox
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: firefox
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: webkit
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Upload the evidence of failed live flows
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-flows-evidence
          path: subprojects/semantifyr-live/frontend/build/evidence/
          if-no-files-found: ignore
      - name: Show the container log
        if: ${{ failure() }}
        run: docker logs live
      - name: Save the image
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker save "$IMAGE:$TAG" "$IMAGE:snapshot" | gzip > "$RUNNER_TEMP/live-image.tar.gz"
      - name: Upload the image
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: live-image
          path: ${{ runner.temp }}/live-image.tar.gz
          compression-level: 0
          retention-days: 1

  # the image is pushed once every test of the run has passed, as it was when one job ran them all before the image
  push-image:
    name: Push the live image
    if: ${{ inputs.publish }}
    needs:
      - units
      - semantics
      - integration
      - end-to-end
      - ui
      - live-image
    runs-on: ubuntu-latest
    permissions: {}
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: live-image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load < "$RUNNER_TEMP/live-image.tar.gz"
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        env:
          TAG: ${{ needs.live-image.outputs.tag }}
        run: docker push "$IMAGE:$TAG" && docker push "$IMAGE:snapshot"
