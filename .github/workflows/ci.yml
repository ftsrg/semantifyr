name: Continuous Integration
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      GRADLE_ENCRYPTION_KEY:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      tag:
        value: ${{ jobs.live-image.outputs.tag }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: true
  THETA_JAVA_OPTS: -Xss512M -Xms256M -Xmx1500M
jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the toolchain
        uses: ./.github/actions/toolchain
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Install the backends
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/backends
      - name: Cache the VS Code download
        uses: actions/cache@v6
        with:
          path: subprojects/semantifyr-vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ hashFiles('subprojects/semantifyr-vscode/package.json') }}
      - name: Run Build
        if: ${{ runner.os != 'Windows' }}
        run: ./gradlew build semanticTest integrationTest endToEndTest --continue
      # temporary: the Windows runner is lost during the suites, and a sample a minute shows what runs out
      - name: Run Build
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          sample=$(cat <<'SAMPLE'
          $system = Get-CimInstance Win32_OperatingSystem; $all = @(Get-Process); $java = @($all | Where-Object Name -eq 'java'); 'sample {0:HH:mm:ss} freePhysicalMB={1:N0} freeCommitMB={2:N0} processes={3} java={4} javaPrivateMB={5:N0} cmd={6} conhost={7} handles={8}' -f (Get-Date), ($system.FreePhysicalMemory / 1KB), ($system.FreeVirtualMemory / 1KB), $all.Count, $java.Count, (($java | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB), @($all | Where-Object Name -eq 'cmd').Count, @($all | Where-Object Name -eq 'conhost').Count, ($all | Measure-Object HandleCount -Sum).Sum
          SAMPLE
          )
          (
            while true; do
              powershell -NoProfile -Command "$sample"
              sleep 60
            done
          ) &
          sampler=$!
          status=0
          ./gradlew build semanticTest integrationTest endToEndTest --continue || status=$?
          kill "$sampler"
          exit "$status"
      - name: Publish to SonarCloud
        if: ${{ runner.os == 'Linux' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: .github/scripts/sonar.sh
      - name: Pack Distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew pack -Pwebsite.apiDocs=true
      - name: Upload GitHub Pages artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: subprojects/website/build/docusaurus
          retention-days: 90
      - name: Upload semantifyr-cli
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: semantifyr-cli
          path: subprojects/semantifyr-cli/build/distributions/semantifyr-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload sysml-cli
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: sysml-cli
          path: subprojects/frontends/sysml/sysml-cli/build/distributions/semantifyr-sysml-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload gamma-cli
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: gamma-cli
          path: subprojects/frontends/gamma/gamma-cli/build/distributions/semantifyr-gamma-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Pack the model test harness and the SysML v2 corpus
        if: ${{ runner.os == 'Linux' }}
        run: >-
          tar -czf "$RUNNER_TEMP/model-tests.tar.gz" -C subprojects
          corpus-check/build/distributions
          frontends/sysml/sysml-wrapper/build/corpus
      - name: Upload the model test harness
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: model-tests
          path: ${{ runner.temp }}/model-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload semantifyr-vscode
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: semantifyr-vscode
          path: subprojects/semantifyr-vscode/build/semantifyr-*.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload the live image context
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: live-image-context
          path: subprojects/semantifyr-live/backend/build/distributions/live-image-context.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload the vscode-server image context
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: vscode-server-image-context
          path: subprojects/semantifyr-vscode-server/build/distributions/vscode-server-image-context.tar.gz
          compression-level: 0
          retention-days: 1

  model-tests-gamma:
    name: Model tests (gamma)
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Install the backends
        uses: ./.github/actions/backends
      - name: Download gamma-cli
        uses: actions/download-artifact@v8
        with:
          name: gamma-cli
          path: ${{ runner.temp }}/downloads
      - name: Download the model test harness
        uses: actions/download-artifact@v8
        with:
          name: model-tests
          path: ${{ runner.temp }}/downloads
      - name: Unpack them
        run: |
          cd "$RUNNER_TEMP"
          mkdir model-tests
          tar -xzf downloads/model-tests.tar.gz -C model-tests
          unzip -q model-tests/corpus-check/build/distributions/corpus-check-*.zip -d harness
          unzip -q downloads/semantifyr-gamma-*.zip -d launcher
      - name: Run the model tests of the semantic library
        run: >-
          "$RUNNER_TEMP"/harness/corpus-check-*/bin/corpus-check
          --launcher "$(echo "$RUNNER_TEMP"/launcher/semantifyr-gamma-*/bin/semantifyr-gamma)"
          --corpus subprojects/frontends/gamma/models/semantics
          --timeout-seconds 120
      - name: Run the model tests of the examples
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP"/harness/corpus-check-*/bin/corpus-check
          --launcher "$(echo "$RUNNER_TEMP"/launcher/semantifyr-gamma-*/bin/semantifyr-gamma)"
          --corpus subprojects/frontends/gamma/models/examples
          --timeout-seconds 1800

  model-tests-sysml:
    name: Model tests (sysml)
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install the backends
        uses: ./.github/actions/backends
      - name: Download sysml-cli
        uses: actions/download-artifact@v8
        with:
          name: sysml-cli
          path: ${{ runner.temp }}/downloads
      - name: Download the model test harness
        uses: actions/download-artifact@v8
        with:
          name: model-tests
          path: ${{ runner.temp }}/downloads
      - name: Unpack them
        run: |
          cd "$RUNNER_TEMP"
          mkdir model-tests
          tar -xzf downloads/model-tests.tar.gz -C model-tests
          unzip -q model-tests/corpus-check/build/distributions/corpus-check-*.zip -d harness
          unzip -q downloads/semantifyr-sysml-*.zip -d launcher
      - name: Run the model tests
        run: >-
          "$RUNNER_TEMP"/harness/corpus-check-*/bin/corpus-check
          --launcher "$(echo "$RUNNER_TEMP"/launcher/semantifyr-sysml-*/bin/semantifyr-sysml)"
          --corpus "$RUNNER_TEMP/model-tests/frontends/sysml/sysml-wrapper/build/corpus"
          --case-namespace semantifyr::sysml::model::
          --timeout-seconds 120

  ui-tests:
    name: UI Tests (${{ matrix.browser }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    runs-on: ubuntu-latest
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the toolchain
        uses: ./.github/actions/toolchain
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Install the browser
        timeout-minutes: 15
        uses: ./.github/actions/browsers
        with:
          browsers: ${{ matrix.browser }}
      - name: Run the UI suite
        run: ./gradlew uiTest --continue -PtestBrowser="$TEST_BROWSER"
      - name: Upload the live screens
        uses: actions/upload-artifact@v7
        with:
          name: live-screens-${{ matrix.browser }}
          path: subprojects/semantifyr-live/frontend/build/screens/
          if-no-files-found: warn
      - name: Upload the evidence of failed UI tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence-${{ matrix.browser }}
          path: |
            subprojects/semantifyr-live/frontend/build/evidence/
            subprojects/website/build/evidence/
          if-no-files-found: ignore

  reuse-check:
    name: REUSE Compliance Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          args: --include-meson-subprojects lint

  vscode-server-image:
    name: Build the semantifyr-vscode-server Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-vscode-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download the vscode-server image context
        uses: actions/download-artifact@v8
        with:
          name: vscode-server-image-context
      - name: Unpack the vscode-server image context
        run: mkdir context && tar -xzf vscode-server-image-context.tar.gz -C context
      - name: Compute the tag
        id: tag
        run: echo "tag=$(sed -n 's/^version=//p' gradle.properties)-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          load: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:snapshot
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=vscode-server-image
          cache-to: type=gha,mode=max,scope=vscode-server-image
      - name: Smoke test
        timeout-minutes: 5
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/smoke-test-vscode-server-image.sh "$IMAGE:$TAG"
      - name: Save the image
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker save "$IMAGE:$TAG" "$IMAGE:snapshot" | gzip > "$RUNNER_TEMP/vscode-server-image.tar.gz"
      - name: Upload the image
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: vscode-server-image
          path: ${{ runner.temp }}/vscode-server-image.tar.gz
          compression-level: 0
          retention-days: 1

  live-image:
    name: Build Live Image
    needs:
      - build
      - ui-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install the browsers for the live flows
        id: browsers
        timeout-minutes: 15
        uses: ./.github/actions/browsers
        with:
          browsers: chromium firefox webkit
      - name: Download the live image context
        uses: actions/download-artifact@v8
        with:
          name: live-image-context
      - name: Unpack the live image context
        run: mkdir context && tar -xzf live-image-context.tar.gz -C context
      - name: Compute the tag
        id: tag
        run: echo "tag=$(sed -n 's/^version=//p' gradle.properties)-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          load: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:snapshot
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start and check the container
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .github/scripts/smoke-test-live-image.sh live "$IMAGE:$TAG"
      - name: Smoke test
        timeout-minutes: 5
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
        run: npm run smoke -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on Chromium
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: chromium
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on Firefox
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: firefox
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: webkit
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Upload the evidence of failed live flows
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-flows-evidence
          path: subprojects/semantifyr-live/frontend/build/evidence/
          if-no-files-found: ignore
      - name: Show the container log
        if: ${{ failure() }}
        run: docker logs live
      - name: Save the image
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker save "$IMAGE:$TAG" "$IMAGE:snapshot" | gzip > "$RUNNER_TEMP/live-image.tar.gz"
      - name: Upload the image
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: live-image
          path: ${{ runner.temp }}/live-image.tar.gz
          compression-level: 0
          retention-days: 1

  push-image:
    name: Push Live Image
    if: ${{ inputs.publish }}
    needs: live-image
    runs-on: ubuntu-latest
    permissions: {}
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-live
    steps:
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: live-image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load < "$RUNNER_TEMP/live-image.tar.gz"
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        env:
          TAG: ${{ needs.live-image.outputs.tag }}
        run: docker push "$IMAGE:$TAG" && docker push "$IMAGE:snapshot"

  push-vscode-server-image:
    name: Push the semantifyr-vscode-server Image
    if: ${{ inputs.publish }}
    needs: vscode-server-image
    runs-on: ubuntu-latest
    permissions: {}
    env:
      IMAGE: docker.io/ftsrgbot/semantifyr-vscode-server
    steps:
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: vscode-server-image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load < "$RUNNER_TEMP/vscode-server-image.tar.gz"
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        env:
          TAG: ${{ needs.vscode-server-image.outputs.tag }}
        run: docker push "$IMAGE:$TAG" && docker push "$IMAGE:snapshot"
