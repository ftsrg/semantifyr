name: Continuous Integration
on:
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      GRADLE_ENCRYPTION_KEY:
        required: false
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      tag:
        value: ${{ jobs.live-image.outputs.tag }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  THETA_JAVA_OPTS: -Xss512M -Xms256M -Xmx1500M
jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up the toolchain
        uses: ./.github/actions/toolchain
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Install the backends
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/backends
      - name: Cache the VS Code download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: subprojects/semantifyr-vscode/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ hashFiles('subprojects/semantifyr-vscode/package.json') }}
      - name: Run Build
        run: ./gradlew build continuousIntegration --continue
      - name: Publish to SonarCloud
        if: ${{ runner.os == 'Linux' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -z "$SONAR_TOKEN" || ./gradlew sonar -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
      - name: Install the browser for the screenshots
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 15
        uses: ./.github/actions/browsers
        with:
          browsers: chromium
      - name: Pack Distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew pack
      - name: Upload GitHub Pages artifact
        if: ${{ runner.os == 'Linux' && inputs.publish }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: subprojects/website/build/docusaurus
          retention-days: 90
      - name: Upload semantifyr-cli
        if: ${{ runner.os == 'Linux' && inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantifyr-cli
          path: subprojects/semantifyr-cli/build/distributions/semantifyr-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload sysml-cli
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sysml-cli
          path: subprojects/frontends/sysml/sysml-cli/build/distributions/semantifyr-sysml-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload gamma-cli
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gamma-cli
          path: subprojects/frontends/gamma/gamma-cli/build/distributions/semantifyr-gamma-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Pack the frontend test harness
        if: ${{ runner.os == 'Linux' }}
        run: >-
          tar -czf "$RUNNER_TEMP/frontend-tests.tar.gz" -C subprojects
          corpus-check/build/distributions
      - name: Upload the frontend test harness
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-tests
          path: ${{ runner.temp }}/frontend-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload semantifyr-vscode
        if: ${{ runner.os == 'Linux' && inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantifyr-vscode
          path: subprojects/semantifyr-vscode/build/semantifyr-*.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload the live image context
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-image-context
          path: subprojects/semantifyr-live/backend/build/distributions/live-image-context.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload the vscode-server image context
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-server-image-context
          path: subprojects/semantifyr-vscode-server/build/distributions/vscode-server-image-context.tar.gz
          compression-level: 0
          retention-days: 1

  frontend-tests-gamma:
    name: Frontend Tests (Gamma)
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the frontend tests
        uses: ./.github/actions/frontend-tests
        with:
          frontend: gamma
      - name: Run the frontend tests of the semantic library
        run: corpus-check --launcher "$LAUNCHER" --corpus subprojects/frontends/gamma/models/semantics --timeout-seconds 120

  frontend-tests-sysml:
    name: Frontend Tests (SysML)
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the frontend tests
        uses: ./.github/actions/frontend-tests
        with:
          frontend: sysml
      - name: Run the frontend tests
        run: >-
          corpus-check --launcher "$LAUNCHER"
          --corpus subprojects/frontends/sysml/models/semantics
          --case-namespace semantifyr::sysml::model::
          --timeout-seconds 120

  ui-tests:
    name: UI Tests (${{ matrix.browser }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the toolchain
        uses: ./.github/actions/toolchain
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Install the browser
        timeout-minutes: 15
        uses: ./.github/actions/browsers
        with:
          browsers: ${{ matrix.browser }}
      - name: Run the UI suite
        env:
          BROWSER: ${{ matrix.browser }}
        run: ./gradlew "uiTest${BROWSER^}" --continue
      - name: Upload the evidence of failed UI tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-evidence-${{ matrix.browser }}
          path: subprojects/semantifyr-live/frontend/build/evidence/
          if-no-files-found: ignore

  reuse-check:
    name: REUSE Compliance Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          args: --include-meson-subprojects lint

  vscode-server-image:
    name: Build the semantifyr-vscode-server Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bake the image
        id: image
        uses: ./.github/actions/bake-image
        with:
          name: vscode-server
          save: ${{ inputs.publish }}
      - name: Smoke test
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: .github/scripts/smoke-test-vscode-server-image.sh "$IMAGE"

  live-image:
    name: Build Live Image
    needs:
      - build
      - ui-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bake the image
        id: image
        uses: ./.github/actions/bake-image
        with:
          name: live
          save: ${{ inputs.publish }}
      - name: Start the container
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: docker run -d --name live -p 8080:8080 --cap-drop ALL --security-opt no-new-privileges:true "$IMAGE"
      - name: Smoke test
        timeout-minutes: 10
        uses: ./.github/actions/smoke-test
        with:
          url: http://localhost:8080
      - name: Install the browsers for the live flows
        if: ${{ !cancelled() }}
        id: browsers
        timeout-minutes: 15
        uses: ./.github/actions/browsers
        with:
          browsers: chromium firefox webkit
      - name: Run the live flows on the image on Chromium
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: chromium
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on Firefox
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: firefox
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Run the live flows on the image on WebKit
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SEMANTIFYR_LIVE_URL: http://localhost:8080
          TEST_BROWSER: webkit
        run: npm run flows -w @ftsrg/semantifyr-live-frontend
      - name: Upload the evidence of failed live flows
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-flows-evidence
          path: subprojects/semantifyr-live/frontend/build/evidence/
          if-no-files-found: ignore
      - name: Show the container log
        if: ${{ failure() }}
        run: docker logs live

  push-images:
    name: Push the ${{ matrix.name }} Image
    if: ${{ inputs.publish }}
    needs:
      - live-image
      - vscode-server-image
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        name:
          - live
          - vscode-server
    steps:
      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.name }}-image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load < "$RUNNER_TEMP/${{ matrix.name }}-image.tar.gz"
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ftsrgbot
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        run: docker push --all-tags "docker.io/ftsrgbot/semantifyr-${{ matrix.name }}"
