name: Deploy Live Instance
on:
  workflow_call:
    inputs:
      instance:
        type: string
        required: true
      tag:
        description: Empty deploys the tag staging runs.
        type: string
        default: ''
      url:
        type: string
        required: true
permissions: {}
jobs:
  deploy:
    name: Deploy ${{ inputs.instance }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ inputs.instance }}
      cancel-in-progress: false
    environment:
      name: live-fured
      url: ${{ inputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT }}
          user: ${{ vars.DEPLOY_USER }}
      - name: Deploy
        env:
          INSTANCE: ${{ inputs.instance }}
          TAG: ${{ inputs.tag }}
        run: |
          tag=${TAG:-$(ssh fured status semantifyr-live-staging)}
          tar -C deploy/live -cz compose.yaml deploy.sh | ssh fured deploy "$INSTANCE" "$tag"

  smoke-test:
    name: Smoke test ${{ inputs.instance }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        timeout-minutes: 10
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ inputs.url }}
