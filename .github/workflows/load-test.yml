name: Load test
on:
  schedule:
    # before the fured suites start at 01:00 on the VM staging runs on, so their load stays out of the numbers
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Live instance for the load test.
        type: string
        default: https://live-staging.semantifyr.org
      students:
        type: number
        default: 10
      ramp:
        description: Seconds over which the students join.
        type: number
        default: 30
permissions: {}
jobs:
  load-test:
    name: Load test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: load-test
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # the run sends a SysML v2 example as the OXSTS the build compiles it to, and verifies each served case alone against the bound before the class
      - name: Load test
        timeout-minutes: 60
        env:
          URL: ${{ inputs.url || 'https://live-staging.semantifyr.org' }}
          STUDENTS: ${{ inputs.students || 10 }}
          RAMP: ${{ inputs.ramp || 30 }}
        # the live instances run main, whose /api/portfolios names no default portfolio yet
        run: >-
          ./gradlew :semantifyr-live-frontend:loadTest
          "-PloadTest.args=--url $URL --students $STUDENTS --ramp $RAMP
          --portfolio smart --output $GITHUB_WORKSPACE/load-test.json --summary $GITHUB_STEP_SUMMARY"
      - name: Upload the load test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-test-report
          path: load-test.json
          retention-days: 30
