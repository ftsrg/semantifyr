name: Nightly
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  nightly:
    name: Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    concurrency:
      group: nightly
      cancel-in-progress: false
    environment: nightly-fured
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure SSH
        uses: ./.github/actions/ssh
        with:
          key: ${{ secrets.NIGHTLY_SSH_KEY }}
          known-hosts: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
          host: ${{ vars.NIGHTLY_HOST }}
          port: ${{ vars.NIGHTLY_PORT }}
          user: ${{ vars.NIGHTLY_USER }}
      - name: Run the nightly on fured
        run: ssh fured run "$GITHUB_SHA"
      - name: Fetch the test results
        if: ${{ !cancelled() }}
        run: ssh fured results "$GITHUB_SHA" > nightly-test-results.tar.gz
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-test-results
          path: nightly-test-results.tar.gz
          compression-level: 0
          retention-days: 30
