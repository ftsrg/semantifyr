name: Nightly
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Live instance for the load test.
        type: string
        default: https://live-staging.semantifyr.org
      students:
        type: number
        default: 10
      ramp:
        description: Seconds over which the students join.
        type: number
        default: 30
permissions: {}
jobs:
  nightly:
    name: Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: {}
    concurrency:
      group: nightly
      cancel-in-progress: false
    environment: nightly-fured
    steps:
      - name: Configure SSH
        env:
          NIGHTLY_SSH_KEY: ${{ secrets.NIGHTLY_SSH_KEY }}
          NIGHTLY_KNOWN_HOSTS: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
          NIGHTLY_HOST: ${{ vars.NIGHTLY_HOST }}
          NIGHTLY_PORT: ${{ vars.NIGHTLY_PORT }}
          NIGHTLY_USER: ${{ vars.NIGHTLY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$NIGHTLY_SSH_KEY" > ~/.ssh/nightly
          chmod 600 ~/.ssh/nightly
          printf '%s\n' "$NIGHTLY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host fured\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/nightly\n  ServerAliveInterval 60\n' \
            "$NIGHTLY_HOST" "$NIGHTLY_PORT" "$NIGHTLY_USER" > ~/.ssh/config
      - name: Run the integration and nightly suites on fured
        run: ssh fured run "$GITHUB_SHA"
      - name: Fetch the test results
        if: ${{ !cancelled() }}
        run: ssh fured results "$GITHUB_SHA" > nightly-test-results.tar.gz
      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results
          path: nightly-test-results.tar.gz
          compression-level: 0
          retention-days: 30

  load-test:
    name: Load test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: load-test
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Load test
        timeout-minutes: 20
        env:
          URL: ${{ inputs.url || 'https://live-staging.semantifyr.org' }}
          STUDENTS: ${{ inputs.students || 10 }}
          RAMP: ${{ inputs.ramp || 30 }}
        # the live instances run main, whose /api/portfolios names no default portfolio yet
        run: >-
          npm run load-test -w @ftsrg/semantifyr-live-frontend --
          --url "$URL" --students "$STUDENTS" --ramp "$RAMP" --max-verify-p95 120
          --portfolio smart-full --output "$GITHUB_WORKSPACE/load-test.json"
      - name: Upload the load test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-test-report
          path: load-test.json
          retention-days: 30
